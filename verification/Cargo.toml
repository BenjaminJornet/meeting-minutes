[package]
name = "meetily-verification"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
log = "0.4"
once_cell = "1"
regex = "1"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
